<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apuestas Club</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col font-sans">

    <!-- Header -->
    <header class="bg-slate-900 border-b border-slate-800 py-6 px-4 text-center relative">
        <h1 class="text-3xl font-extrabold text-emerald-400 tracking-wider uppercase">
            Apuestas Club
        </h1>
        <p class="text-slate-400 text-sm mt-1">Gestor de apuestas con fichas ficticias entre amigos</p>
        
        <!-- Indicador de modo -->
        <span id="mode-badge" class="hidden absolute top-4 right-4 bg-amber-500/10 border border-amber-500/30 text-amber-400 text-xs px-2.5 py-1 rounded-full font-semibold">
            Modo Jugador
        </span>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-4xl w-full mx-auto p-4 md:p-6 grid gap-6 md:grid-cols-2">

        <!-- Sección: Registro de Jugadores (Solo ADMIN) -->
        <section id="admin-players-section" class="bg-slate-800/60 border border-slate-700/50 rounded-xl p-5 shadow-lg flex flex-col gap-4">
            <h2 class="text-xl font-bold text-slate-100 flex items-center gap-2">
                👥 Jugadores
            </h2>
            
            <form id="player-form" class="flex gap-2">
                <input 
                    type="text" 
                    id="player-name" 
                    placeholder="Nombre del jugador" 
                    required 
                    class="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-emerald-500"
                />
                <button 
                    type="submit" 
                    class="bg-emerald-600 hover:bg-emerald-500 text-white font-medium px-4 py-2 rounded-lg text-sm transition"
                >
                    Añadir
                </button>
            </form>

            <!-- Lista de Jugadores -->
            <div id="players-list" class="flex flex-col gap-2 mt-2 max-h-60 overflow-y-auto pr-1">
                <!-- Se llena dinámicamente -->
            </div>
        </section>

        <!-- Sección: Crear Nueva Apuesta (Solo ADMIN) -->
        <section id="admin-create-bet-section" class="bg-slate-800/60 border border-slate-700/50 rounded-xl p-5 shadow-lg flex flex-col gap-4">
            <h2 class="text-xl font-bold text-slate-100 flex items-center gap-2">
                🎯 Nueva Apuesta
            </h2>

            <form id="bet-form" class="flex flex-col gap-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">DESCRIPCIÓN</label>
                    <input 
                        type="text" 
                        id="bet-description" 
                        placeholder="Ej. ¿Quién gana el clásico?" 
                        required 
                        class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-emerald-500"
                    />
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">MONTO EN FICHAS (Por jugador)</label>
                    <input 
                        type="number" 
                        id="bet-amount" 
                        min="1" 
                        placeholder="100" 
                        required 
                        class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-emerald-500"
                    />
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">PARTICIPANTES</label>
                    <div id="bet-participants" class="bg-slate-900 border border-slate-700 rounded-lg p-3 max-h-32 overflow-y-auto flex flex-col gap-2">
                        <!-- Se llena dinámicamente -->
                    </div>
                </div>

                <button 
                    type="submit" 
                    class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2 rounded-lg text-sm mt-1 transition"
                >
                    Crear Apuesta
                </button>
            </form>
        </section>

        <!-- Sección: Apuestas Activas (ÚNICA SECCIÓN VISIBLE PARA JUGADORES) -->
        <section id="bets-section" class="bg-slate-800/60 border border-slate-700/50 rounded-xl p-5 shadow-lg md:col-span-2 flex flex-col gap-4">
            <h2 class="text-xl font-bold text-slate-100 flex items-center gap-2">
                🔥 Apuestas Activas
            </h2>

            <div id="bets-list" class="grid gap-4 sm:grid-cols-2">
                <!-- Se llena dinámicamente -->
            </div>
        </section>

    </main>

    <!-- JavaScript para Lógica de la App -->
    <script>
        // Comprobar parámetros de la URL para determinar el modo
        const urlParams = new URLSearchParams(window.location.search);
        const isPlayerMode = urlParams.get('mode') === 'jugador';

        // Ocultar elementos si es Modo Jugador
        if (isPlayerMode) {
            document.getElementById('admin-players-section').classList.add('hidden');
            document.getElementById('admin-create-bet-section').classList.add('hidden');
            document.getElementById('mode-badge').classList.remove('hidden');
        }

        // Estado Global
        let players = JSON.parse(localStorage.getItem('ac_players')) || [
            { id: 1, name: 'Carlos', balance: 1000 },
            { id: 2, name: 'Sofía', balance: 1000 }
        ];

        let bets = JSON.parse(localStorage.getItem('ac_bets')) || [];

        // Guardar en LocalStorage
        function saveData() {
            localStorage.setItem('ac_players', JSON.stringify(players));
            localStorage.setItem('ac_bets', JSON.stringify(bets));
        }

        // Renderizar Lista de Jugadores (Solo para panel admin)
        function renderPlayers() {
            const list = document.getElementById('players-list');
            const participantsContainer = document.getElementById('bet-participants');

            if (list) list.innerHTML = '';
            if (participantsContainer) participantsContainer.innerHTML = '';

            if (players.length === 0) {
                if (list) list.innerHTML = '<p class="text-slate-500 text-xs italic">No hay jugadores registrados.</p>';
                if (participantsContainer) participantsContainer.innerHTML = '<p class="text-slate-500 text-xs italic">Agrega jugadores primero.</p>';
                return;
            }

            players.forEach(player => {
                if (list) {
                    const pDiv = document.createElement('div');
                    pDiv.className = 'flex justify-between items-center bg-slate-900/60 border border-slate-700/50 p-2.5 rounded-lg text-sm';
                    pDiv.innerHTML = `
                        <span class="font-medium text-slate-200">${player.name}</span>
                        <span class="font-bold text-emerald-400 bg-emerald-950/50 px-2 py-0.5 rounded border border-emerald-800/50">${player.balance} 🪙</span>
                    `;
                    list.appendChild(pDiv);
                }

                if (participantsContainer) {
                    const label = document.createElement('label');
                    label.className = 'flex items-center gap-2 text-xs text-slate-300 cursor-pointer hover:text-white';
                    label.innerHTML = `
                        <input type="checkbox" value="${player.id}" class="participant-checkbox rounded bg-slate-800 border-slate-700 text-emerald-500 focus:ring-0">
                        ${player.name} (${player.balance} 🪙)
                    `;
                    participantsContainer.appendChild(label);
                }
            });
        }

        // Renderizar Lista de Apuestas Activas
        function renderBets() {
            const container = document.getElementById('bets-list');
            container.innerHTML = '';

            if (bets.length === 0) {
                container.innerHTML = '<p class="text-slate-500 text-xs italic sm:col-span-2">No hay apuestas activas en este momento.</p>';
                return;
            }

            bets.forEach(bet => {
                const totalPool = bet.amount * bet.participants.length;
                const card = document.createElement('div');
                card.className = 'bg-slate-900 border border-slate-700 p-4 rounded-xl flex flex-col justify-between gap-3';

                let participantNames = bet.participants
                    .map(id => players.find(p => p.id === id)?.name || 'Desconocido')
                    .join(', ');

                let winnerOptions = bet.participants.map(id => {
                    const p = players.find(player => player.id === id);
                    return `<option value="${id}">${p ? p.name : 'Desconocido'}</option>`;
                }).join('');

                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-start gap-2 mb-2">
                            <h3 class="font-bold text-slate-100 text-base leading-tight">${bet.description}</h3>
                            <span class="text-xs font-bold text-amber-400 bg-amber-950/40 border border-amber-800/40 px-2 py-1 rounded">
                                Pozo: ${totalPool} 🪙
                            </span>
                        </div>
                        <p class="text-xs text-slate-400"><strong>Apuesta:</strong> ${bet.amount} 🪙 por persona</p>
                        <p class="text-xs text-slate-400 mt-1"><strong>Participantes:</strong> ${participantNames}</p>
                    </div>

                    <div class="border-t border-slate-800 pt-3 flex flex-col gap-2">
                        <label class="text-xs font-semibold text-slate-400">Declarar Ganador:</label>
                        <div class="flex gap-2">
                            <select id="winner-select-${bet.id}" class="flex-1 bg-slate-800 border border-slate-700 text-xs text-slate-200 rounded px-2 py-1.5 focus:outline-none">
                                ${winnerOptions}
                            </select>
                            <button 
                                onclick="resolveBet(${bet.id})" 
                                class="bg-emerald-600 hover:bg-emerald-500 text-white font-medium text-xs px-3 py-1.5 rounded transition"
                            >
                                Cobrar
                            </button>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // Eventos Admin
        if (!isPlayerMode) {
            document.getElementById('player-form').addEventListener('submit', (e) => {
                e.preventDefault();
                const input = document.getElementById('player-name');
                const name = input.value.trim();

                if (name) {
                    players.push({
                        id: Date.now(),
                        name: name,
                        balance: 1000
                    });
                    input.value = '';
                    saveData();
                    renderPlayers();
                }
            });

            document.getElementById('bet-form').addEventListener('submit', (e) => {
                e.preventDefault();
                const desc = document.getElementById('bet-description').value.trim();
                const amount = parseInt(document.getElementById('bet-amount').value);
                
                const selectedCheckboxes = document.querySelectorAll('.participant-checkbox:checked');
                const selectedIds = Array.from(selectedCheckboxes).map(cb => parseInt(cb.value));

                if (selectedIds.length < 2) {
                    alert('Selecciona al menos 2 participantes para la apuesta.');
                    return;
                }

                const cantAfford = selectedIds.some(id => {
                    const player = players.find(p => p.id === id);
                    return player.balance < amount;
                });

                if (cantAfford) {
                    alert('Uno o más jugadores seleccionados no tienen suficientes fichas.');
                    return;
                }

                selectedIds.forEach(id => {
                    const player = players.find(p => p.id === id);
                    player.balance -= amount;
                });

                bets.push({
                    id: Date.now(),
                    description: desc,
                    amount: amount,
                    participants: selectedIds
                });

                document.getElementById('bet-description').value = '';
                document.getElementById('bet-amount').value = '';
                saveData();
                renderPlayers();
                renderBets();
            });
        }

        // Resolver Apuesta
        function resolveBet(betId) {
            const bet = bets.find(b => b.id === betId);
            const select = document.getElementById(`winner-select-${betId}`);
            const winnerId = parseInt(select.value);

            const totalPool = bet.amount * bet.participants.length;

            const winner = players.find(p => p.id === winnerId);
            if (winner) {
                winner.balance += totalPool;
            }

            bets = bets.filter(b => b.id !== betId);

            saveData();
            renderPlayers();
            renderBets();
        }

        // Inicializar
        renderPlayers();
        renderBets();
    </script>
</body>
</html>
